name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: tar -czf mouthfeel-claude.tgz -C dist/claude .
      - run: tar -czf mouthfeel-codex.tgz -C dist/codex .
      - run: tar -czf mouthfeel-pi.tgz -C dist/pi .
      - run: tar -czf mouthfeel-opencode.tgz -C dist/opencode .
      - run: tar -czf mouthfeel-antigravity.tgz -C dist/antigravity .
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: mouthfeel-*.tgz
